tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.ALL
}

ext.registerJarFiles = { List<String> filePaths ->
    tasks.withType(Jar).configureEach {
        filePaths.each { path ->
            from(rootProject.file(path))
        }
    }
}

if (!project.hasProperty("factions_version")) {
    project.ext.factions_version = project.minecraft_version + "-" + project.factions_mod_version
}

if (!project.hasProperty("vampirism_version")) {
    project.ext.vampirism_version = project.minecraft_version + "-" + project.vampirism_mod_version
}

subprojects {
    apply plugin: 'eclipse'
    apply plugin: 'maven-publish'
    apply from: rootProject.file('gradle/idea.gradle')
    apply from: rootProject.file('gradle/license.gradle')

    afterEvaluate {
        def mavenUrl = System.getenv("MAVEN_URL")
        if (mavenUrl) {
            publishing {
                repositories {
                    maven {
                        url = mavenUrl
                        credentials {
                            username = System.getenv("MAVEN_USERNAME") ?: ""
                            password = System.getenv("MAVEN_PASSWORD") ?: ""
                        }
                    }
                }
            }
        }
    }
}