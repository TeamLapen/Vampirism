apply from: rootProject.file('gradle/repositories.gradle')

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

List<Project> dependencyProjects = [
        project(':vampirism-api'),
]

if (project.vampirism_factions_source_dependency.toBoolean()) {
    dependencyProjects.add(project(':faction-api'))
    dependencyProjects.add(project(':faction'))
}

dependencyProjects.forEach {
    project.evaluationDependsOn(it.path)
}

dependencies {
    dependencyProjects.forEach {
        compileOnly(it)
        localRuntime(it)
        testImplementation(it)
    }

    // Annotation processor that generates the Converted<Name> base classes (@ConvertedCreature)
    compileOnly(project(':vampirism-processor'))
    annotationProcessor(project(':vampirism-processor'))

    if (project.vampirism_factions_source_dependency.toBoolean()) {
        interfaceInjectionData project(':faction')
        accessTransformers project(':faction')
    }

    if (!vampirism_factions_source_dependency.toBoolean()) {
        api(accessTransformers(interfaceInjectionData("de.teamlapen.faction:FactionApi:${project.vampirism_factions_version}")))
    }

    if (include_jei.toBoolean()) {
        compileOnly "mezz.jei:jei-${jei_mc_version}-common-api:${project.jei_version}"
        compileOnly "mezz.jei:jei-${jei_mc_version}-neoforge-api:${project.jei_version}"
        localRuntime "mezz.jei:jei-${jei_mc_version}-neoforge:${project.jei_version}"
    }

    if (include_guideapi.toBoolean()) {
        compileOnly "de.maxanier.guideapi:Guide-API-VP:${guideapi_mc_version}-${project.guideapi_version}"
        localRuntime "de.maxanier.guideapi:Guide-API-VP:${guideapi_mc_version}-${project.guideapi_version}"
    }

    if (include_terrablender.toBoolean()) {
        compileOnly "com.github.glitchfiend:TerraBlender-neoforge:${project.terrablender_version}"
        localRuntime "com.github.glitchfiend:TerraBlender-neoforge:${project.terrablender_version}"
    }

    if (include_jade.toBoolean()) {
        localRuntime "curse.maven:jade-324717:" + project.jade_version
    }

}