# gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# java
java_version=25

# neoforge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neoforge_version=26.1.2.36-beta

# common
mod_version=2.0.0

# factions
factions_mod_id=factionapi
factions_mod_name=FactionAPI
factions_license=LGPL-3.0
factions_group_id=de.teamlapen.faction
factions_authors=maxanier, cheaterpaul
factions_description=A factions mod for Minecraft
factions_issue_tracker=https://github.com/TeamLapen/Vampirism/issues

# vampirism
vampirism_mod_id=vampirism
vampirism_mod_name=Vampirism
vampirism_mod_license=LGPL-3.0
vampirism_group_id=de.teamlapen.vampirism
vampirism_authors=maxanier, cheaterpaul
vampirism_description=Allows you to become a vampire
vampirism_url=https://vampirism.dev
vampirism_issue_tracker=https://github.com/TeamLapen/Vampirism/issues
vampirism_update_url=https://api.modrinth.com/updates/vampirism/forge_updates.json?neoforge=only

# integrations
# jei
include_jei=true
jei_mc_version=26.1.2
jei_version=29.5.0.28

# guide-api
include_guideapi=false
guideapi_version=1.21.1-2.3.0

# terrablender
include_terrablender=true
terrablender_version=26.1.2-26.1.2.0.1

# runtime helper
# jade
include_jade=false
jade_version=5729884

#appleskin (factionapi)
include_appleskin=true
appleskin_version=mc26.1-3.0.9
