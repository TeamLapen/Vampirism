name: publish.yml
on:
  push:
    tags:
      - '*-alpha.*'
      - '*-beta.*'
  release:
    types:
      - published

jobs:
  build:
    strategy:
      matrix:
        project: [ 'faction', 'vampirism' ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'adopt'
          cache: 'gradle'
      - name: Setup Gradle
        run: ./gradlew
      - name: Build API
        run: ./gradlew ${{ matrix.project }}-api:build
      - name: Build Mod
        run: ./gradlew ${{ matrix.project }}:build
      - name: Upload Jars
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project }}-jars
          path: '**/*.jar'
          retention-days: 2
  publish-maven:
    strategy:
      matrix:
        project: [ 'faction', 'vampirism' ]
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.project }}-jars
      - name: Publish to Maven
  publish-curseforge:
    strategy:
      matrix:
        project: [ 'faction', 'vampirism' ]
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.project }}-jars
      - name: Publish to Curseforge
  publish-modrinth:
    strategy:
      matrix:
        project: [ 'faction', 'vampirism' ]
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.project }}-jars
      - name: Publish to Modrinth