name: Gradle Build

on:
  push:
    branches:
      - 'dev'
      - 'feature/*'
      - 'version/*'
  pull_request:
    branches:
      - 'dev'
      - 'feature/*'
      - 'version/*'
      - 'translate/*'

#env:
#  ORG_GRADLE_PROJECT_vampirism_factions_source_dependency: false

jobs:
  build:
    strategy:
      matrix:
        project: ['faction', 'vampirism']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'adopt'
          cache: 'gradle'
      - name: Setup Gradle
        run: ./gradlew
      - name: Build API
        run: ./gradlew ${{ matrix.project }}-api:build
      - name: Build Mod
        run: ./gradlew ${{ matrix.project }}:build
      - name: Run data generation
        run: ./gradlew ${{ matrix.project }}:runData
      - name: Verify generated resources are up to date
        run: |
          generated="projects/${{ matrix.project }}/src/generated"
          if [ -n "$(git status --porcelain -- "$generated")" ]; then
            echo "::error::Data generation produced uncommitted changes in $generated. Run './gradlew ${{ matrix.project }}:runData' locally and commit the result."
            git status --porcelain -- "$generated"
            git diff -- "$generated"
            exit 1
          fi

